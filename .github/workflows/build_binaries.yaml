name: Build QMK firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each keymap family declares its firmware source, pinned to a commit, in
  # firmware_sources.json. The build matrix has one entry per keymap family;
  # this fails if a build target's keymap has no entry in that file.
  firmware-sources:
    name: Read firmware sources
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Build matrix from firmware_sources.json
        id: matrix
        run: |
          python3 .github/scripts/firmware_sources.py matrix >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.family }})
    needs: firmware-sources
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-sources.outputs.matrix) }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK CLI dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Configure QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      # A build target's keymap name is its keymap family, matched exactly.
      - name: Select build targets
        env:
          FAMILY: ${{ matrix.family }}
        run: python3 .github/scripts/firmware_sources.py select "$FAMILY"

      - name: Validate userspace
        run: qmk userspace-doctor

      - name: Build
        run: |
          if qmk userspace-compile --help | grep -q "print-failures"; then
              EXTRA_ARGS="-p"
          fi
          qmk userspace-compile -e DUMP_CI_METADATA=yes $EXTRA_ARGS || touch .failed
          # Generate the step summary markdown
          ./qmk_firmware/util/ci/generate_failure_markdown.sh > $GITHUB_STEP_SUMMARY || true
          # Truncate to a maximum of 1MB to deal with GitHub workflow limit
          truncate --size='<960K' $GITHUB_STEP_SUMMARY || true
          # Exit with failure if the compilation stage failed
          [ ! -f .failed ] || exit 1

      # Not every firmware source prints compiler output for failed targets,
      # so dump the per-target failure logs into the job log as well.
      - name: Show failure logs
        if: failure()
        run: |
          find qmk_firmware/.build -name 'failed.log.*' | sort | while read -r log; do
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.family }}
          if-no-files-found: error
          path: |
            *.bin
            *.hex
            *.uf2

  # Runs the unit tests of the hydeik_vial keymap family with the same
  # `make test` as a local run. The firmware source goes where `make firmware`
  # puts it, at its pinned commit, so the Makefile's check of the checkout
  # passes. The tests are built natively; the container provides gcc and make,
  # as it does for the unit tests of the firmware source itself.
  test:
    name: Test (${{ matrix.family }})
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      matrix:
        family: [hydeik_vial]

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Read the firmware source from firmware_sources.json
        id: source
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          source = json.load(open("firmware_sources.json"))[os.environ["FAMILY"]]
          print("repo=" + source["repo"])
          print("ref=" + source["ref"])
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          path: .firmware/${{ matrix.family }}
          submodules: recursive

      - name: Run unit tests
        run: make test

  # Replaces the `latest` release, only from `main` and only when every build
  # target succeeded and the unit tests passed, so a failed build or a failed
  # test never removes previously published firmware.
  publish:
    name: Publish
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l firmware
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest firmware/* \
            --target "$GITHUB_SHA" \
            --title "Latest QMK Firmware" \
            --notes "Built from $GITHUB_SHA."
