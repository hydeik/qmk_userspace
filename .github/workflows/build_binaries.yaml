name: Build QMK firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix:
        # Each build target in qmk.json is built against exactly one firmware
        # source: keymaps whose name ends with `_vial` go to vial-qmk, all
        # others go to upstream qmk_firmware.
        include:
          - name: qmk
            repo: qmk/qmk_firmware
            ref: master
            vial: false
          - name: vial
            repo: vial-kb/vial-qmk
            ref: vial
            vial: true

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK CLI dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Configure QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      - name: Select build targets
        env:
          VIAL: ${{ matrix.vial }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          want_vial = os.environ["VIAL"] == "true"

          with open("qmk.json") as f:
              data = json.load(f)

          # Targets are [keyboard, keymap] pairs.
          data["build_targets"] = [
              target
              for target in data["build_targets"]
              if target[1].endswith("_vial") == want_vial
          ]
          if not data["build_targets"]:
              raise SystemExit("No build targets selected for this firmware source")

          with open("qmk.json", "w") as f:
              json.dump(data, f, indent=4)

          for keyboard, keymap in data["build_targets"]:
              print(f"{keyboard}:{keymap}")
          EOF

      - name: Validate userspace
        run: qmk userspace-doctor

      - name: Build
        run: |
          if qmk userspace-compile --help | grep -q "print-failures"; then
              EXTRA_ARGS="-p"
          fi
          qmk userspace-compile -e DUMP_CI_METADATA=yes $EXTRA_ARGS || touch .failed
          # Generate the step summary markdown
          ./qmk_firmware/util/ci/generate_failure_markdown.sh > $GITHUB_STEP_SUMMARY || true
          # Truncate to a maximum of 1MB to deal with GitHub workflow limit
          truncate --size='<960K' $GITHUB_STEP_SUMMARY || true
          # Exit with failure if the compilation stage failed
          [ ! -f .failed ] || exit 1

      # Not every firmware source prints compiler output for failed targets,
      # so dump the per-target failure logs into the job log as well.
      - name: Show failure logs
        if: failure()
        run: |
          find qmk_firmware/.build -name 'failed.log.*' | sort | while read -r log; do
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          if-no-files-found: error
          path: |
            *.bin
            *.hex
            *.uf2

  # Replaces the `latest` release, only from `main` and only when every build
  # target succeeded, so a failed build never removes previously published
  # firmware.
  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l firmware
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest firmware/* \
            --target "$GITHUB_SHA" \
            --title "Latest QMK Firmware" \
            --notes "Built from $GITHUB_SHA."
