name: Build QMK firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # firmware_sources.json declares the firmware sources by name, each pinned to
  # a commit and listing the keymaps built against it. The build matrix has
  # one entry per firmware source that has build targets; this fails if the
  # keymap of a build target is listed by no firmware source, or by more than
  # one. The test matrix has one entry per firmware source that unit tests run
  # on.
  firmware-sources:
    name: Read firmware sources
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Build and test matrices from firmware_sources.json
        id: matrix
        run: |
          python3 .github/scripts/firmware_sources.py matrix >> "$GITHUB_OUTPUT"
          python3 .github/scripts/firmware_sources.py test-matrix >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.firmware_source }})
    needs: firmware-sources
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-sources.outputs.matrix) }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK CLI dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Configure QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      # Keeps the build targets whose keymap this firmware source lists.
      - name: Select build targets
        env:
          FIRMWARE_SOURCE: ${{ matrix.firmware_source }}
        run: python3 .github/scripts/firmware_sources.py select "$FIRMWARE_SOURCE"

      - name: Validate userspace
        run: qmk userspace-doctor

      - name: Build
        run: |
          if qmk userspace-compile --help | grep -q "print-failures"; then
              EXTRA_ARGS="-p"
          fi
          qmk userspace-compile -e DUMP_CI_METADATA=yes $EXTRA_ARGS || touch .failed
          # Generate the step summary markdown
          ./qmk_firmware/util/ci/generate_failure_markdown.sh > $GITHUB_STEP_SUMMARY || true
          # Truncate to a maximum of 1MB to deal with GitHub workflow limit
          truncate --size='<960K' $GITHUB_STEP_SUMMARY || true
          # Exit with failure if the compilation stage failed
          [ ! -f .failed ] || exit 1

      # Not every firmware source prints compiler output for failed targets,
      # so dump the per-target failure logs into the job log as well.
      - name: Show failure logs
        if: failure()
        run: |
          find qmk_firmware/.build -name 'failed.log.*' | sort | while read -r log; do
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.firmware_source }}
          if-no-files-found: error
          path: |
            *.bin
            *.hex
            *.uf2

  # Runs the unit tests once per firmware source, with the same `make test` as
  # a local run, limited to the tests that run on that firmware source. A unit
  # test names the firmware sources it runs on in its test.mk. The firmware
  # source goes where `make firmware` puts it, at its pinned commit, so the
  # Makefile's check of the checkout passes. The tests are built natively; the
  # container provides gcc and make, as it does for the unit tests of the
  # firmware source itself.
  test:
    name: Test (${{ matrix.firmware_source }})
    needs: firmware-sources
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-sources.outputs.test_matrix) }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: .firmware/${{ matrix.firmware_source }}
          submodules: recursive

      - name: Run unit tests
        env:
          FIRMWARE_SOURCE: ${{ matrix.firmware_source }}
        run: make test FIRMWARE_SOURCE="$FIRMWARE_SOURCE"

  # Checks that the committed keymap image is the one `make keymap-image`
  # writes from the sources, and fails if it is stale. It neither regenerates
  # nor commits the image, and it runs the unit tests of the script that writes
  # it first. It needs no firmware source. `publish` does not need this job: a
  # stale keymap image turns the workflow red but never holds back a firmware
  # release. The container is the environment in which the image was shown to
  # be byte for byte the one written on macOS; it has no `uv`, so pip installs
  # it into a virtual environment of its own, which leaves the environment of
  # the QMK CLI alone. Neither Python nor `uv` is pinned here; keymap-drawer
  # and its dependencies are, in users/hydeik/image/requirements.txt.
  keymap-image:
    name: Keymap image
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Install uv
        run: |
          python3 -m venv /tmp/uv
          /tmp/uv/bin/pip install --quiet uv
          echo /tmp/uv/bin >> "$GITHUB_PATH"

      - name: Run the unit tests of the script
        run: make keymap-image-test

      # `git diff --exit-code` exits with 1 on a difference; any other failure
      # is one of git itself and is not reported as a stale image. Only the
      # stat is printed, not the diff of the SVG.
      - name: Check that the committed keymap image is current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make keymap-image
          status=0
          git diff --exit-code --stat -- users/hydeik/image/keymap.svg || status=$?
          if [ "$status" -eq 1 ]; then
              echo "::error file=users/hydeik/image/keymap.svg::The keymap image users/hydeik/image/keymap.svg is stale: it is not the one that make keymap-image writes from the sources. Run make keymap-image and commit the result."
          fi
          exit "$status"

  # Replaces the `latest` release, only from `main` and only when every build
  # target succeeded and the unit tests passed on every firmware source, so a
  # failed build or a failed test never removes previously published firmware.
  publish:
    name: Publish
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l firmware
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest firmware/* \
            --target "$GITHUB_SHA" \
            --title "Latest QMK Firmware" \
            --notes "Built from $GITHUB_SHA."
